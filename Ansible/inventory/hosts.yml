---
all:
  hosts:
    node0:
      ansible_host: hp001.utah.cloudlab.us
    node1:
      ansible_host: hp002.utah.cloudlab.us
    node2:
      ansible_host: hp003.utah.cloudlab.us
    node3:
      ansible_host: hp004.utah.cloudlab.us
    node4:
      ansible_host: hp005.utah.cloudlab.us
    node5:
      ansible_host: hp006.utah.cloudlab.us
    node6:
      ansible_host: hp007.utah.cloudlab.us
    node7:
      ansible_host: hp008.utah.cloudlab.us
    node8:
      ansible_host: hp009.utah.cloudlab.us
    node9:
      ansible_host: hp010.utah.cloudlab.us
  children:
    server:
      hosts:
        node0:
    clients:
      hosts:
        node1:
        node2:
        node3:
        node4:
        node5:
        node6:
        node7:
        node8:
        node9:
  vars:
    # CloudLab credentials for the allocated cluster — fill in per allocation:
    #   export CLOUDLAB_USER=<your CloudLab username>
    # The SSH key path is derived from $HOME (default key name: SSH_Key_Cloudlab).
    ansible_user: "{{ lookup('env', 'CLOUDLAB_USER') | default('CHANGE_ME', true) }}"
    ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/SSH_Key_Cloudlab"
